[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
default-run = "shopping-sessions"

[dependencies]
snap = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgo_gen)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
